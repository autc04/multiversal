# DragMgr.yaml — Drag Manager interface definitions
#
# The Drag Manager shipped as an extension for System 7.0/7.1 and as part
# of the system from 7.5 on.  Its whole 68K interface is a single trap,
# `_DragDispatch` (0xABED), with a routine selector in D0.
#
# PROVENANCE, stated plainly because this file cannot claim the same
# origin as the rest of the repository.  The names, signatures, constants
# and structure layouts are from Apple's published documentation — Inside
# Macintosh: Drag and Drop, and the Drag Manager Reference.  Executor
# never implemented the Drag Manager, so there is no clean-room header
# here to have generated this from, and the SELECTOR NUMBERS are not in
# the documentation at all: they are an ABI fact that exists only in
# Apple's `Drag.h` inline sequences, and that is where they were read.
#
# No Apple header text is reproduced.  If that is not a good enough
# footing for this repository, the maintainer should say so and this file
# should be dropped rather than quietly kept — the selectors are the only
# part that cannot be sourced elsewhere, and they are also the only part
# whose being wrong would stop a machine rather than fail to compile.
#
# VERIFIED BY RUNNING, which is worth more than a header comparison and is
# the part that is genuinely first-hand.  A program built against these
# definitions registers a tracking handler and a receive handler on its
# own window, is dropped on by the Finder, reads the `flavorTypeHFS`
# data back as an FSSpec, and opens the file — on **Mac OS 8.1** (Quadra
# 650, Basilisk II) and installing cleanly on **Mac OS 9.2.2** (Power
# Macintosh G4, QEMU).  So 0x7001, 0x7002, 0x7003, 0x7004, 0x700E,
# 0x700F, 0x7013, 0x7014, 0x701E and 0x701F are known good on hardware;
# the rest are transcribed and unrun.
#
# One detail that matters and is easy to get wrong: Apple's inlines use
# MOVEQ (0x70nn), which clears the whole of D0.  `selector-location: D0W`
# generates exactly that for selectors under 128, and every selector here
# is under 128 - the same shape as AliasDispatch in AliasMgr.yaml.
#
# COVERAGE, and checked rather than asserted.  This file declares 39 trap
# functions, which is every one Apple's Drag.h declares, and the two were
# compared mechanically: name, selector, return type and argument count
# all agree, 39 for 39.  The selectors run 0x01 to 0x28 with 0x08 absent,
# and that gap is Apple's own numbering rather than something missing
# here.
#
# The comparison is `tests/dragmgr_selectors.rb`, so it is reproducible by
# anyone holding the header rather than a claim in a comment:
#
#     ruby tests/dragmgr_selectors.rb /path/to/Drag.h
#
# It skips where the header is absent, which it is here -- Apple's header
# is not redistributable and no text from it is reproduced.  The generated
# code was checked the same way: a wrapper for each of the 39, compiled
# for m68k and disassembled, emits `moveq #n,d0` and the 0xABED trap, with
# n as declared.

- typedef:
    name: DragRef
    type: Ptr
    comment: |
      A drag.  Opaque: allocated by NewDrag, or handed to a handler by
      the Drag Manager.

# ####

- typedef:
    name: DragItemRef
    type: UInt32
    comment: |
      One item within a drag.  Not an index: GetDragItemReferenceNumber
      turns a one-based index into one of these.

# ####

- typedef:
    name: FlavorType
    type: OSType

# ####

- typedef:
    name: DragAttributes
