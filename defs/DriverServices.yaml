# DriverServices.yaml — native driver and Driver Services Library definitions
#
# What a PowerPC native ('ndrv') driver needs beyond the Device Manager:
# the DriverDescription every native driver exports, and the part of the
# Driver Services Library it calls -- execution levels, timing, interrupt
# timers, the interrupt tree, resident memory, and preparing memory for
# DMA.  PowerPC only: the routines are exported by DriverServicesLib.
# Apple split these between Devices.h, DriverServices.h, Kernel.h and
# Interrupts.h; all four names are available here.
#
# Written from Designing PCI Cards and Drivers for Power Macintosh Computers
# (Apple, 1995-1999), chapters 8 and 11.  No Apple header text is
# reproduced.  Coverage is partial: what a PCI block-storage driver needs,
# not the whole library.
#
# These are PowerPC-native structures, laid out with natural (PowerPC)
# alignment rather than the 2-byte 68k packing the generator applies to
# everything else; the pragmas at the start and end of the file switch it.
# That matters once they are embedded in a driver's own structures: an
# InterruptSetMember after a Boolean has to start on a 4-byte boundary.
# The structures that matter for layout (DriverDescription above all, which
# the system reads out of the driver's data section) carry `size:`.

- verbatim: |
    #pragma pack(push)
    #pragma pack()

