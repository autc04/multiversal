      - name: kISTInputDMAInterruptSource
        value: 2
      - name: kISTPropertyMemberCount
        value: 3

# ####

- typedef:
    name: ISTProperty
    type: InterruptSetMember[kISTPropertyMemberCount]
    comment: |
      The value of a device's "driver-ist" Name Registry property: the
      interrupt sources that belong to it.  A PCI card with one interrupt
      line uses only kISTChipInterruptSource.

# ####

- verbatim: |
    #define kISTPropertyName "driver-ist"

# ####

- typedef:
    name: InterruptReturnValue
    type: SInt32

# ####

- enum:
    values:
      - name: kFirstMemberNumber
        value: 1
      - name: kIsrIsComplete
        value: 0
        comment: the interrupt was this device's, and has been handled
      - name: kIsrIsNotComplete
        value: -1
        comment: not this device's; offer it to the others sharing the line
      - name: kMemberNumberParent
        value: -2

# ####

- typedef:
    name: InterruptSourceState
    type: Boolean

# ####

- enum:
    values:
      - name: kSourceWasEnabled
        value: 1
      - name: kSourceWasDisabled
        value: 0

# ####

- verbatim: |
    typedef InterruptMemberNumber (*InterruptHandler)(InterruptSetMember ISTmember,
                                                      void *refCon,
                                                      UInt32 theIntCount);
    typedef void (*InterruptEnabler)(InterruptSetMember ISTmember, void *refCon);
    typedef InterruptSourceState (*InterruptDisabler)(InterruptSetMember ISTmember,
                                                      void *refCon);

# ####

- function:
    name: InstallInterruptFunctions
    return: OSStatus
    args:
      - name: setID
        type: InterruptSetID
      - name: member
        type: InterruptMemberNumber
      - name: refCon
        type: void*
      - name: handlerFunction
        type: InterruptHandler
      - name: enableFunction
        type: InterruptEnabler
      - name: disableFunction
        type: InterruptDisabler
    comment: |
      Task level only.  A nil function leaves whatever is installed in
      place, so a driver can take over the handler while keeping the
      platform's enabler and disabler.

# ####

- function:
    name: GetInterruptFunctions
    return: OSStatus
    args:
      - name: setID
        type: InterruptSetID
      - name: member
        type: InterruptMemberNumber
      - name: refCon
        type: void**
      - name: handlerFunction
        type: InterruptHandler*
      - name: enableFunction
        type: InterruptEnabler*
      - name: disableFunction
        type: InterruptDisabler*
    comment: |
      Installing replaces the member's handler, and PCI interrupt lines are
      shared; reading the old one first lets a driver pass on interrupts
      that are not its own.

