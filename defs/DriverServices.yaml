# ####

- function:
    name: CurrentExecutionLevel
    return: ExecutionLevel
    comment: |
      Callable at any level.  Many Driver Services calls, the memory pool
      and PrepareMemoryForIO among them, are legal only at kTaskLevel.

# ####

- typedef:
    name: Duration
    type: SInt32
    comment: |
      Positive values are milliseconds, negative values are negated
      microseconds, as with the Time Manager.  The two forms are
      interchangeable, so code converting a Duration has to handle both.

# ####

- enum:
    values:
      - name: durationMicrosecond
        value: -1
      - name: durationMillisecond
        value: 1
      - name: durationSecond
        value: 1000
      - name: durationMinute
        value: 1000 * 60
      - name: durationHour
        value: 1000 * 60 * 60
      - name: durationDay
        value: 1000 * 60 * 60 * 24
      - name: durationForever
        value: 0x7FFFFFFF
      - name: durationImmediate
        value: 0

# ####

- struct:
    name: AbsoluteTime
    members:
      - name: hi
        type: UInt32
      - name: lo
        type: UInt32
    size: 8
    comment: |
      Time base units.  Their length varies from machine to machine;
      convert with the routines below rather than assuming one.

# ####

- struct:
    name: Nanoseconds
    members:
      - name: hi
        type: UInt32
      - name: lo
        type: UInt32
    size: 8

# ####

- function:
    name: UpTime
    return: AbsoluteTime
    comment: |
      Time since startup.  Callable at any level.

# ####

- function:
    name: AbsoluteDeltaToDuration
    return: Duration
    args:
      - name: leftAbsoluteTime
        type: AbsoluteTime
      - name: rightAbsoluteTime
        type: AbsoluteTime
    comment: |
      Returns left minus right, and zero if that is negative, so the later
      time goes on the left: AbsoluteDeltaToDuration(UpTime(), start).
      This is the reverse of what the book's note on the routine suggests;
      the order given here is the one observed under Mac OS 9.2.2.

# ####

- function:
    name: DurationToAbsolute
    return: AbsoluteTime
    args:
      - name: duration
        type: Duration

# ####

- function:
    name: AddDurationToAbsolute
    return: AbsoluteTime
    args:
      - name: duration
        type: Duration
      - name: absoluteTime
        type: AbsoluteTime

# ####

- function:
    name: DelayFor
    return: OSStatus
    args:
      - name: expirationTime
        type: Duration
    comment: |
      Blocks, so task level only.  The delay can run long but not short.

# ####

- function:
    name: DelayForHardware
    return: OSStatus
    args:
      - name: absoluteTime
        type: AbsoluteTime
    comment: |
      Busy-waits, which makes it callable at any level.  The argument is
      the length of the delay, not a deadline: convert with
      DurationToAbsolute.  Passing UpTime() plus a delay spins for the
      machine's whole uptime.

# ####

- typedef:
    name: TimerID
    type: KernelID

# ####

- verbatim: |
    typedef OSStatus (*SecondaryInterruptHandler2)(void *p1, void *p2);

# ####

- function:
    name: SetInterruptTimer
    return: OSStatus
    args:
      - name: expirationTime
        type: const AbsoluteTime*
      - name: handler
        type: SecondaryInterruptHandler2
      - name: p1
        type: void*
      - name: timer
        type: TimerID*
    comment: |
      Runs handler as a secondary interrupt handler once expirationTime (an
      absolute time, unlike DelayForHardware's argument) is reached.  The
      handler gets p1, and the program counter at expiry as p2.  Callable
      at any level.

# ####

- function:
    name: CancelTimer
    return: OSStatus
    args:
      - name: timer
        type: TimerID
      - name: timeRemaining
        type: AbsoluteTime*
    comment: |
      Fails if the timer has already fired or been cancelled, which is how
      a caller learns that the handler has run or is about to.

# ####

- function:
    name: SynchronizeIO
    comment: |
      Orders accesses to noncached (memory-mapped I/O) space against the
      instructions around them.

