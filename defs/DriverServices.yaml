# ####

- enum:
    values:
      - name: kNextIOIsInput
        value: 0x00000001
      - name: kNextIOIsOutput
        value: 0x00000002
      - name: kMoreIOTransfers
        value: 0x00000004
        comment: keep the preparation for another transfer

# ####

- function:
    name: CheckpointIO
    return: OSStatus
    args:
      - name: theIOPreparation
        type: IOPreparationID
      - name: theOptions
        type: IOCheckpointOptions

