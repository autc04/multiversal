# ####

- enum:
    values:
      - name: kIOMultipleRanges
        value: 0x00000001
      - name: kIOLogicalRanges
        value: 0x00000002
        comment: required; Mac OS does not accept physical ranges
      - name: kIOMinimalLogicalMapping
        value: 0x00000004
      - name: kIOShareMappingTables
        value: 0x00000008
      - name: kIOIsInput
        value: 0x00000010
        comment: data moves into main memory
      - name: kIOIsOutput
        value: 0x00000020
        comment: data moves out of main memory
      - name: kIOCoherentDataPath
        value: 0x00000040
      - name: kIOClientIsUserMode
        value: 0x00000080

# ####

- typedef:
    name: IOPreparationState
    type: OptionBits

# ####

- enum:
    values:
      - name: kIOStateDone
        value: 0x00000001

# ####

- struct:
    name: IOPreparationTable
    members:
      - name: options
        type: IOPreparationOptions
      - name: state
        type: IOPreparationState
        comment: "<-- kIOStateDone once the whole range is prepared"
      - name: preparationID
        type: IOPreparationID
        comment: "<-- pass to CheckpointIO"
      - name: addressSpace
        type: AddressSpaceID
      - name: granularity
        type: ByteCount
      - name: firstPrepared
        type: ByteCount
      - name: lengthPrepared
        type: ByteCount
        comment: "<--"
      - name: mappingEntryCount
        type: ItemCount
      - name: logicalMapping
        type: LogicalMappingTablePtr
      - name: physicalMapping
        type: PhysicalMappingTablePtr
      - name: rangeInfo
        union:
          - name: range
            type: AddressRange
          - name: multipleRanges
            type: MultipleAddressRange
    size: 48
    comment: |
      Fields marked <-- are filled in by PrepareMemoryForIO.

# ####

- function:
    name: PrepareMemoryForIO
    return: OSStatus
    args:
      - name: theIOPreparationTable
        type: IOPreparationTable*
    comment: |
      Locks a buffer down, settles the caches, and returns its physical
      addresses for a bus-master transfer; CheckpointIO undoes it.  Task
      level only.

# ####

- typedef:
    name: IOCheckpointOptions
