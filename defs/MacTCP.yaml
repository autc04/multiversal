# MacTCP.yaml — MacTCP `.IPP` driver interface definitions
#
# Written from the MacTCP Programmer's Guide (Apple, 1989-1994) and
# Inside Macintosh: Networking.  Clean-room: no Apple header text is
# reproduced; struct layouts encode the documented driver ABI.
#
# NOTE: MacTCP defines no A-traps.  Applications reach the driver via
# PBOpen("\p.IPP") + PBControl, so this file contributes types,
# constants, and parameter blocks only — no `function`/trap entries.
# The native driver implementation lives in Executor (src/mactcp/).
#
# Layout conventions: 68k (mac68k) alignment, i.e. 2-byte alignment for
# anything wider than a byte, which the generator applies for us.
# Apple's headers name their padding bytes (`filler`); there is no need
# to declare them here, and the `size:` on each struct is what pins the
# result.  Absolute byte offsets are given in comments; parameter-block
# union members are offset relative to csParam (= byte 32 of the
# enclosing iopb).
#
# Layouts have been checked field by field against Apple's Universal
# Interfaces 3.4.2 by compiling that header and comparing computed
# offsets (see tests/mactcp_abi.cpp).  Two blocks did not match what
# the Programmer's Guide describes -- TCPReceivePB's field order and
# TCPStatusPB's connStatPtr -- and both are noted where they occur.

- typedef:
    name: ip_addr
    type: ULONGINT
    comment: |
      IPv4 address.  Numeric value; guest byte order (big-endian) is
      identical to network byte order.

- typedef:
    name: ip_port
    type: uint16_t

- typedef:
    name: tcp_port
    type: uint16_t

- typedef:
    name: StreamPtr
    type: Ptr
    comment: |
      Opaque stream cookie returned by TCPCreate/UDPCreate and passed
      back in every subsequent call.  Applications must not
      dereference it.

