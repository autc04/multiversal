- struct:
    name: TMTask
    members:
      - name: qLink
        type: QElemPtr
      - name: qType
        type: INTEGER
      - name: tmAddr
        type: ProcPtr
      - name: tmCount
        type: LONGINT
      - name: tmWakeUp
        type: LONGINT
      - name: tmReserved
        type: LONGINT
        comment: |
          I don't trust IMIV-301
    size: 22

# ####

- function:
    name: InsTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    executor: true
    trap: 0xA058
    executor_extras: ClearD0

# ####

- function:
    name: InsXTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    trap: 0xA458

# ####

- function:
    name: RmvTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
    executor: true
    trap: 0xA059
    executor_extras: ClearD0

# ####

- function:
    name: PrimeTime
    args:
      - name: taskp
        type: QElemPtr
        register: A0
      - name: count
        type: LONGINT
        register: D0
    executor: true
    trap: 0xA05A
    executor_extras: ClearD0

# ####
# Raw 68K entry points (Executor only).  The wrapper objects and the
# RAW_<name> prototypes are generated; the bodies live in emustubs.cpp
# (or pack.cpp/patches.cpp), and emustubs.h keeps only the structs.
- only-for: Executor
  function:
    name: Microseconds
    executor_raw: true
    trap: 0xA193
